<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<!-- viewport-fit=cover обязателен: от него зависят все env(safe-area-inset-*) в стилях. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f4f1ee"/>
<meta name="description" content="Пункт: график, зарплаты и деньги ваших ПВЗ — с телефона."/>
<!-- Экраны приложения (вход, данные за логином) не индексируются: поисковикам отдаётся
     лендинг public/welcome.html на taktab.ru/ (см. vercel.json). -->
<meta name="robots" content="noindex, follow"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<!-- default, а не black-translucent: иначе контент уезжает под системную полосу. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Пункт"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png"/>
<title>Пункт</title>
</head>
<body>
<div id="root"></div><script type="module" src="/src/main.tsx"></script>
</body>
</html>
